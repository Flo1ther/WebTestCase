services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testflow
      POSTGRES_USER: testflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/bootstrap.py}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testflow -d testflow']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:11025:1025'
      - '127.0.0.1:18025:8025'
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://testflow:${DATABASE_PASSWORD}@db:5432/testflow
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      TRUSTED_PROXY_IPS: 172.30.73.10/32
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DEMO_SEED_ON_START: ${DEMO_SEED_ON_START:-true}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.73.10
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.73.0/24
