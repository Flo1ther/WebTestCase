# Local SonarQube SAST configuration for WebTestCase.
# Credentials are deliberately not stored here; pass SONAR_TOKEN at scan time.
sonar.projectKey=webtestcase-local
sonar.projectName=WebTestCase
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Application source, excluding generated and third-party content.
sonar.sources=apps,config,frontend/src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/node_modules/**,**/dist/**,**/.venv/**,docs/**,artifacts/**

# The backend is verified with Python 3.12 in this project.
sonar.python.version=3.12
